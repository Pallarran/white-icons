<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="350">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.28" stop-color="#f2c84a"/>
      <stop offset="0.55" stop-color="#d9a32c"/>
      <stop offset="0.78" stop-color="#b47a16"/>
      <stop offset="1" stop-color="#e2b23e"/>
    </linearGradient>
    <linearGradient id="goldSide" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.45" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#e07a1e"/>
    </radialGradient>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="400">
      <stop offset="0" stop-color="#5ff0dc"/>
      <stop offset="0.45" stop-color="#22c4b0"/>
      <stop offset="1" stop-color="#0d7f78"/>
    </linearGradient>
    <linearGradient id="violetL" gradientUnits="userSpaceOnUse" x1="210" y1="400" x2="256" y2="466">
      <stop offset="0" stop-color="#9c86ff"/>
      <stop offset="1" stop-color="#5b3fc4"/>
    </linearGradient>
    <linearGradient id="violetR" gradientUnits="userSpaceOnUse" x1="302" y1="400" x2="256" y2="466">
      <stop offset="0" stop-color="#6d4fd8"/>
      <stop offset="1" stop-color="#3c2593"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- the outline of the village: house, keep, house (shared by shadow, body, highlight) -->
  <g id="skyline-shapes" fill="none" stroke-linejoin="miter" stroke-miterlimit="10">
  </g>

  <!-- warm light behind the windows -->
  <g filter="url(#soft)" opacity="0.55">
    <path d="M241 236 V220 A15 15 0 0 1 271 220 V236 Z" fill="#ffb84a"/>
    <rect x="145" y="268" width="24" height="24" fill="#ffb84a"/>
    <rect x="343" y="268" width="24" height="24" fill="#ffb84a"/>
  </g>

  <!-- bevel shadow -->
  <g fill="none" stroke="#6e4508" stroke-width="16" stroke-linejoin="miter" stroke-linecap="square" transform="translate(0 4)">
    <path d="M120 330 V258 L157 214 L199 263"/>
    <path d="M392 330 V258 L355 214 L313 263"/>
    <path d="M208 330 V152 H198 V116 H224 V136 H243 V116 H269 V136 H288 V116 H314 V152 H304 V330"/>
    <path d="M232 330 V300 A24 24 0 0 1 280 300 V330"/>
  </g>
  <!-- gold body -->
  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M120 330 V258 L157 214 L199 263"/>
    <path d="M392 330 V258 L355 214 L313 263"/>
    <path d="M208 330 V152 H198 V116 H224 V136 H243 V116 H269 V136 H288 V116 H314 V152 H304 V330"/>
    <path d="M232 330 V300 A24 24 0 0 1 280 300 V330"/>
  </g>
  <!-- sheen across the metal -->
  <g fill="none" stroke="url(#goldSide)" stroke-width="16" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M120 330 V258 L157 214 L199 263"/>
    <path d="M392 330 V258 L355 214 L313 263"/>
    <path d="M208 330 V152 H198 V116 H224 V136 H243 V116 H269 V136 H288 V116 H314 V152 H304 V330"/>
  </g>

  <!-- flag pole -->
  <path d="M256 118 V50" stroke="#6e4508" stroke-width="8" transform="translate(0 3)"/>
  <path d="M256 118 V50" stroke="url(#gold)" stroke-width="8"/>
  <!-- pennant -->
  <path d="M262 50 L304 62 L262 75 Z" fill="url(#gold)" stroke="#6e4508" stroke-width="2"/>
  <path d="M262 50 L304 62 L262 57 Z" fill="#fff4c0" opacity="0.6"/>

  <!-- lit windows -->
  <path d="M244 234 V221 A12 12 0 0 1 268 221 V234 Z" fill="url(#glow)" stroke="#8a5a10" stroke-width="2"/>
  <rect x="148" y="271" width="18" height="18" fill="url(#glow)" stroke="#8a5a10" stroke-width="2"/>
  <rect x="346" y="271" width="18" height="18" fill="url(#glow)" stroke="#8a5a10" stroke-width="2"/>

  <!-- the ground: a teal crescent the village stands on -->
  <path d="M78 338 Q256 404 434 338 Q256 432 78 338 Z" fill="#0a5f5a" transform="translate(0 5)"/>
  <path d="M78 338 Q256 404 434 338 Q256 432 78 338 Z" fill="url(#teal)"/>
  <path d="M110 349 Q256 397 402 349" fill="none" stroke="#d2fff8" stroke-width="2.5" opacity="0.75"/>
  <!-- the violet keystone -->
  <path d="M210 408 L256 466 L256 408 Z" fill="url(#violetL)"/>
  <path d="M302 408 L256 466 L256 408 Z" fill="url(#violetR)"/>
  <path d="M210 408 L302 408 L293 401 L219 401 Z" fill="#b9a8ff"/>
