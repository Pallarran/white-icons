<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.hb-ship{transform-origin:32px 42px;animation:hb-rock 3.6s ease-in-out infinite}
@keyframes hb-rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.hb-w1{animation:hb-slide 3s linear infinite}.hb-w2{animation:hb-slide 4.5s linear infinite reverse}
@keyframes hb-slide{from{transform:translateX(0)}to{transform:translateX(-20px)}}
</style>
<defs><clipPath id="hb-clip"><rect x="2" y="2" width="60" height="60" rx="12"/></clipPath></defs>
<rect x="2" y="2" width="60" height="60" rx="12" fill="#16161f" stroke="#2c2c3a" stroke-width="1.5"/>
<g clip-path="url(#hb-clip)">

