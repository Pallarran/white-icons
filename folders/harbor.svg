<path class="hb-w2" d="M-10 52 q5 -3.5 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0" stroke="#2f6f8c" stroke-width="2.6" fill="none"/>
<rect x="0" y="54" width="64" height="10" fill="#1d3f52"/>
</g>
